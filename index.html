function teachersFor(area){
  const keys = AREA_KEYS[area.id] || [area.name];
  const hit = s => keys.some(k => s.includes(k)) || s.includes(area.name) || area.name.includes(s);
  return db.settings.staffList.filter(n => { const s = staffInfo(n); return s && ((s.fields || []).some(hit) || Object.entries(s.soft || {}).some(([k, v]) => v === 2 && hit(k))); });

}

/* =========================================================
   自動バックアップ（このパソコンの中に、日ごとの最新の状態を数日分）
   ========================================================= */
const BK_KEEP = 7;              // 残す日数
const BK_GAP = 3 * 60000;       // 書き込みの最短間隔
const bk = { last: 0, t: null, list: [], loaded: false };
const bkOK = () => 'indexedDB' in window;
const idbKeys = () => idb('readonly', st => st.getAllKeys());
const bkCounts = d => ({ users: d.users.filter(x => !x.deleted).length, logs: d.logs.filter(x => !x.deleted).length, meetings: d.meetings.filter(x => !x.deleted).length });
async function bkValue(){ const text = JSON.stringify(db); return { date: today(), ts: Date.now(), ver: APP_VERSION, counts: bkCounts(db), enc: crypt.on, text: crypt.on ? await encryptText(text) : text }; }
function scheduleBackup(){
  if (!started || locked || !bkOK()) return;
  clearTimeout(bk.t);
  bk.t = setTimeout(writeBackup, Math.max(0, bk.last + BK_GAP - Date.now()));
}
async function writeBackup(){
  if (locked) return;
  bk.last = Date.now();
  // 利用者が1人もいないとき（使い始め・全部消した直後）は残さない。中身のあるバックアップを空で上書きしないため
  if (!bkCounts(db).users) return;
  try {
    await idbSet('bk:' + today(), await bkValue());
    const old = (await idbKeys()).filter(k => /^bk:\d/.test(k)).sort().reverse().slice(BK_KEEP);
    for (const k of old) await idbDel(k);
    await loadBackups();
    if (state.view === 'settings') softRender();
  } catch(e) {}
}
// 暗号化の状態が変わったとき：残っているバックアップを、いまの状態（暗号化あり／なし・新しいパスワード）で保存し直す
async function rekeyBackups(){
  if (!bkOK()) return;
  try {
    for (const k of (await idbKeys()).filter(k => String(k).startsWith('bk:'))) {
      try {
        const { b, data } = await readBackup(k);
        const text = JSON.stringify(data);
        await idbSet(k, { ...b, enc: crypt.on, text: crypt.on ? await encryptText(text) : text });
      } catch(e) {}   // 以前のパスワードで暗号化されていて読めないものは、そのまま残す
    }
    await loadBackups();
  } catch(e) {}
}
async function loadBackups(){
  if (!bkOK()) return;
  try {
    const list = [];
    for (const k of (await idbKeys()).filter(k => String(k).startsWith('bk:'))) { const v = await idbGet(k); if (v) list.push({ key: k, date: v.date, ts: v.ts, enc: v.enc, counts: v.counts || {} }); }
    bk.list = list.sort((a, b) => (a.key === 'bk:before') - (b.key === 'bk:before') || b.ts - a.ts);
  } catch(e) { bk.list = []; }
  bk.loaded = true;
}
const bkName = b => b.key === 'bk:before' ? `戻す前の状態（${md(ymd(new Date(b.ts)))} ${hhmm(b.ts)}）` : `${fmtDay(b.date)} ${hhmm(b.ts)}時点`;
function autoBackupList(){
  if (!bkOK()) return '';
  const row = b => `<div class="setrow"><span><b>${esc(bkName(b))}</b><br><span class="small muted">利用者${b.counts.users ?? '－'}人・進み具合${b.counts.logs ?? '－'}件・面談など${b.counts.meetings ?? '－'}件${b.enc ? '・暗号化' : ''}</span></span>
    <span class="row" style="gap:6px"><button class="btn small" data-act="bkSave" data-k="${b.key}">${ic('download')}ファイルに保存</button><button class="btn small" data-act="bkRestore" data-k="${b.key}">${ic('back')}この時点に戻す</button></span></div>`;
  return `<h3>自動バックアップ（このパソコンの中）</h3>
    <p class="small muted" style="margin:0 0 6px">日ごとの最新の状態を、このパソコンの中に${BK_KEEP}日分、自動で残します。${crypt.on ? '暗号化して残しています。' : ''}</p>
    ${bk.list.length ? bk.list.map(row).join('') : `<p class="small muted">${bk.loaded ? 'まだありません。利用者を登録してデータを変更すると作られます。' : '読み込み中…'}</p>`}`;
}
async function readBackup(key){
  const b = await idbGet(key);
  if (!b) throw new Error('このバックアップは見つかりませんでした。');
  let o = JSON.parse(b.text);
  if (isEnv(o)) {
    const k = crypt.keys.get(o.salt);
    if (!k) throw new Error('以前のパスワードで暗号化されたバックアップです。\n「ファイルに保存」してから「バックアップを読み込む」を押し、以前のパスワードを入れて読み込んでください。');
    o = JSON.parse(await decryptEnv(o, k));
  }
  return { b, data: o };
}
async function restoreBackup(key){
  let r;
  try { r = await readBackup(key); } catch(e) { alert(e.message); return; }
  const name = bkName({ key, ...r.b });
  if (!confirm(`${name}の状態に戻します。\n\nこれより後に追加・変更した内容は消えます${sync.handle ? '（共有している他のパソコンにも反映されます）' : ''}。\nいまの状態は「戻す前の状態」として残すので、やり直すこともできます。\n\n戻してよろしいですか？`)) return;
  try { await idbSet('bk:before', await bkValue()); } catch(e) {}
  // 戻した内容を「いちばん新しい変更」として扱い、他のパソコンとの同期でも上書きされないようにする
  const snap = normalize(r.data), now = Date.now();
  COLLS.forEach(k => {
    const ids = new Set(snap[k].map(x => x.id));
    snap[k].forEach(x => { x._ts = now; });
    db[k].forEach(x => { if (!ids.has(x.id)) snap[k].push({ id: x.id, deleted: true, _ts: now }); });
  });
  snap.settings._ts = now; snap.settings._kts = Object.fromEntries(Object.keys(snap.settings).filter(k => !SETTINGS_SKIP.includes(k)).map(k => [k, now]));
  db = snap; primeSettings(); save(); bk.last = Date.now();
  await loadBackups(); render(); toast('元に戻しました');
}

/* =========================================================
   入力途中の下書き（このパソコンの中。暗号化しているときは暗号化して残す）
   ========================================================= */
const DRAFT_DAYS = 14;          // この日数がたった下書きは消す
const drafts = new Map();       // key → { t, title, open:[操作, 値], entries }
let nextDraft = null, draftAuto = null, draftEnc = false;
let draftChain = Promise.resolve();
function storeDrafts(){
  const text = JSON.stringify(Object.fromEntries(drafts));
  draftChain = draftChain.then(async () => {
    try { local.set('drafts', drafts.size ? (crypt.on ? await encryptText(text) : text) : null); draftEnc = crypt.on; } catch(e) {}
  });
}
function saveDraft(key, d){ drafts.set(key, d); storeDrafts(); }
function dropDraft(key){ if (!drafts.has(key)) return; drafts.delete(key); storeDrafts(); }
async function loadDrafts(){
  drafts.clear();
  const s = local.get('drafts'); if (!s) return;
  try {
    let o = JSON.parse(s);
    if (isEnv(o)) { const k = crypt.keys.get(o.salt); if (!k) return; o = JSON.parse(await decryptEnv(o, k)); draftEnc = true; }
    Object.entries(o).forEach(([k, d]) => { if (d && d.t && Date.now() - d.t < DRAFT_DAYS * 86400000) drafts.set(k, d); });
  } catch(e) {}
}

const searchTerms = q => normSearch(String(q).normalize('NFKC')).split(/\s+/).filter(Boolean);
function searchHits(q, uid){
  const terms = searchTerms(q);
  if (!terms.length) return [];
  return searchEntries().filter(e => {
    if (uid && e.uid !== uid && !(e.uids || []).includes(uid)) return false;
    const hay = e._hay || (e._hay = normSearch([e.who, e.kana, e.staff, e.title, ...e.fields.map(f => f[1])].join('\n')));
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
// 見つかった言葉に印を付ける
function markTerms(text, terms){
  const n = normSearch(text), on = new Array(text.length).fill(false);
  terms.forEach(t => { for (let i = n.indexOf(t); i >= 0; i = n.indexOf(t, i + t.length)) for (let k = i; k < i + t.length && k < on.length; k++) on[k] = true; });
  let out = '', cur = false;
  for (let k = 0; k < text.length; k++) { if (on[k] !== cur) { out += cur ? '</mark>' : '<mark>'; cur = on[k]; } out += esc(text[k]); }

function neededTools(u){ return opt('pcSoft').filter(t => (u.tasks || []).some(x => x.includes(t))); }

const eqHost = e => { if (!e.linkTo || e.kind === 'パソコン') return null; const h = eqById(e.linkTo); return h && !h.linkTo && h.id !== e.id ? h : null; };
const eqSplit = (e, d) => !!((eqHost(e) || e).split || {})[d];

const eqChip = x => `<span class="chip" style="margin:2px;white-space:nowrap">${esc(x.e.name)}${x.half ? `<span class="muted">（${HALF_T[x.half]}）</span>` : ''}</span>`;

// 利用終了した人の記録：保存する年数を過ぎた人を知らせ、書き出し・削除できるようにする
const RETAIN_DEF = 5;
const retainYears = () => Number(db.settings.retainYears) || RETAIN_DEF;
const retiredOn = u => u.archivedAt || u.updatedAt || '';
const retireDue = u => { const d = retiredOn(u); if (!d) return false; const lim = parse(d); lim.setFullYear(lim.getFullYear() + retainYears()); return ymd(lim) <= today(); };
const retiredUsers = () => live('users').filter(u => u.archived).sort((a, b) => (retiredOn(a)).localeCompare(retiredOn(b)));
function retireSection(){
  const list = retiredUsers();
  const row = u => `<div class="setrow"><span><b>${esc(u.name)}</b>　<span class="small muted">利用終了 ${fmtDay(retiredOn(u)) || '日付不明'}</span>${retireDue(u) ? ` <span class="badge warn">${retainYears()}年を過ぎています</span>` : ''}</span>
    <span class="row" style="gap:6px"><button class="btn small" data-act="retireExport" data-id="${u.id}">${ic('download')}書き出す</button><button class="btn small danger" data-act="retireDelete" data-id="${u.id}">${ic('trash')}記録を削除</button></span></div>`;
  return `<div class="card anchor" id="set-retire">${sec('users', '利用終了した人の記録')}
    <div class="setrow"><b>保存する年数</b><label class="small row" style="gap:6px"><select id="retainYears" style="width:auto">${[1, 2, 3, 5, 7, 10].map(y => `<option value="${y}" ${retainYears() === y ? 'selected' : ''}>${y}年</option>`).join('')}</select>利用終了からこの年数を過ぎると「今日」でお知らせします</label></div>
    ${list.length ? list.map(row).join('') : '<p class="small muted" style="margin:8px 0 0">利用終了の人はいません。</p>'}
    <p class="small muted" style="margin:10px 0 0">「書き出す」で、その人の記録をすべて1つのファイルに保存できます${crypt.on ? '（暗号化されます）' : ''}。削除する前に、事業所の決まりに沿って保管してください。</p></div>`;
}
async function retireExport(id){
  const u = userById(id); if (!u) return;
  const data = { format: 'shienNote-user-v1', exportedAt: today(), exportedBy: state.me, records: {} };
  userPairs(id).forEach(([k, rid]) => { const x = db[k].find(y => y.id === rid); if (x) (data.records[k] = data.records[k] || []).push(x); });
  const text = crypt.on ? await encryptText(JSON.stringify(data)) : JSON.stringify(data, null, 1);
  download(`作業支援ノート_利用者記録_${u.name.replace(/\s+/g, '')}_${today()}${crypt.on ? '_暗号化' : ''}.json`, text, 'application/json');
  toast('書き出しました');
}
function retireDelete(id){
  const u = userById(id); if (!u) return;
  const pairs = userPairs(id);
  if (!confirm(`${u.name}さんの記録（${pairs.length}件）をすべて削除します。\n共有している他のパソコンからも消えます。\n\n先に「書き出す」で保存しましたか？　削除してよろしいですか？`)) return;
  if (!confirm('元に戻すには、書き出したファイルが必要になります。\n\n本当に削除しますか？')) return;
  // 案件の担当・席の割り当てからも外す
  live('orders').filter(o => (o.assignees || []).includes(id)).forEach(o => { o.assignees = o.assignees.filter(x => x !== id); touch(o); });
  live('equip').forEach(e => { let ch = false; ['assign', 'assignPm'].forEach(k => { const a = { ...(e[k] || {}) }; Object.keys(a).forEach(d => { if (a[d] === id) { delete a[d]; ch = true; } }); e[k] = a; }); if (ch) touch(e); });
  deleteWithUndo(`${u.name}さんの記録`, pairs);
}
function encSection(){
  if (!crypt.supported) return `<div class="card">${sec('lock', 'データの暗号化')}<p class="small" style="margin:0">この開き方では暗号化を使えません。<b>Google Chrome</b> または <b>Microsoft Edge</b> でファイルを開いてください。</p></div>`;
  return `<div class="card anchor" id="set-enc">${sec('lock', 'データの暗号化')}
    ${crypt.on ? `<div class="alert info small" style="margin-bottom:12px"><b>${ic('check')} 暗号化されています。</b>このパソコンのデータ・共有ファイル・バックアップは、パスワードがないと読めません。開くたびにパスワードが必要です。</div>
      ${crypt.rec ? `<div class="setrow" style="margin-bottom:10px"><span><b>回復用コード</b>　<span class="small muted">作成済み${crypt.rec.made ? '（' + fmtDay(crypt.rec.made) + '）' : ''}。パスワードを忘れたときに使います</span></span><button class="btn small" data-act="makeRec">${ic('key')}作り直す</button></div>`
        : `<div class="alert warn small row" style="margin-bottom:12px"><span style="flex:1;min-width:220px"><b>${ic('warning')} 回復用コードがまだありません。</b>パスワードを忘れると、誰もデータを開けなくなります。</span><button class="btn small primary" data-act="makeRec">${ic('key')}回復用コードを作る</button></div>`}
      <div class="row"><button class="btn" data-act="changePass">${ic('key')}パスワードを変更</button><button class="btn" data-act="lock">${ic('lock')}今すぐロック</button>
      ${sync.handle ? '' : `<span class="spacer"></span><button class="btn danger" data-act="disableEnc">暗号化を解除</button>`}</div>`
    : `<p class="small" style="margin-top:0">パスワードで暗号化すると、パソコンの紛失や共有フォルダの設定ミスがあっても、パスワードを知らない人はデータを読めません。<b>利用者の個人情報を守るため、設定をおすすめします。</b></p>
      <p class="small" style="margin-top:0">共有している場合は、1台で設定すれば、他のパソコンでは次の同期のときにパスワードの入力を求められます。</p>
      <button class="btn primary" data-act="setupEnc">${ic('lock')}暗号化を設定する</button>`}
  </div>`;
}

const modal = $('#modal');
function openModal(title, body, onSubmit, extraFoot = '', opts = {}){
  const viewOnly = !onSubmit;
  modal.innerHTML = `<form method="dialog" id="mform">
    <div class="dlg-h"><h2>${title}</h2><button type="button" class="btn icon ghost" data-close aria-label="閉じる">${ic('close')}</button></div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f">${viewOnly ? `<span class="spacer"></span><button type="button" class="btn primary" data-close>閉じる</button>`
      : `${extraFoot}<span class="saveas" id="saveAs"></span><span class="spacer"></span><button type="button" class="btn" data-close>キャンセル</button><button type="submit" class="btn primary">${ic('check')}${opts.ok || '保存する'}</button>`}</div>
  </form>`;
  phraseBreaks(modal);
  const form = $('#mform');
  const snap = () => JSON.stringify([...new FormData(form).entries()]);
  const initial = viewOnly ? '' : snap();
  const draft = viewOnly ? null : nextDraft;
  nextDraft = null;
  const tryClose = () => {
    if (!viewOnly && snap() !== initial) {
      if (!confirm('入力した内容はまだ保存されていません。\n保存せずに閉じてもよろしいですか？')) return;
      if (draft) dropDraft(draft.key);
    }
    modal.close();
  };
  modal.querySelectorAll('[data-close]').forEach(b => b.onclick = tryClose);
  modal.oncancel = e => { e.preventDefault(); tryClose(); };
  const sel = form.querySelector('[name="staff"]');
  const updSaveAs = () => {
    const el = $('#saveAs'); if (!el) return;
    if (!sel) { el.innerHTML = ''; return; }
    const v = sel.value.trim();
    el.className = 'saveas' + (v ? '' : ' unset');
    el.innerHTML = ic('person') + (v ? `<b>${esc(v)}</b>さんとして保存します` : '<b>記入した職員を選んでください</b>');
  };
  if (sel) { sel.addEventListener('change', updSaveAs); sel.addEventListener('input', updSaveAs); }
  updSaveAs();
  form.onsubmit = e => { e.preventDefault(); if (viewOnly) return; if (onSubmit(new FormData(form)) !== false) { if (draft) { clearTimeout(keepDraft.t); dropDraft(draft.key); } modal.close(); render(); } };
  form.onkeydown = e => { if (!viewOnly && (e.ctrlKey || e.metaKey) && (e.key === 'Enter' || e.key === 's')) { e.preventDefault(); form.requestSubmit(); } };
  // 入力途中の内容を下書きとして残す（ブラウザが閉じても、次に開いたときに続きから書ける）
  if (draft) {
    const titleText = draft.title || modal.querySelector('.dlg-h h2').textContent;
    const old = drafts.get(draft.key);
    let bar = null;
    const keep = () => {
      clearTimeout(keepDraft.t);
      keepDraft.t = setTimeout(() => {
        if (!modal.open || $('#mform') !== form) return;
        if (snap() === initial) { if (!bar) dropDraft(draft.key); return; }
        saveDraft(draft.key, { t: Date.now(), title: titleText, open: draft.open, entries: [...new FormData(form).entries()].filter(([, v]) => typeof v === 'string') });
      }, 600);
    };
    const onEdit = e => { if (bar && !bar.contains(e.target)) { bar.remove(); bar = null; } keep(); };
    form.addEventListener('input', onEdit); form.addEventListener('change', onEdit);
    if (old && old.entries && JSON.stringify(old.entries) !== initial) {
      if (draftAuto === draft.key) setTimeout(() => { fillForm(form, old.entries); toast('書きかけの内容を戻しました'); }, 0);
      else {
        bar = document.createElement('div');
        bar.className = 'alert info row draftbar';
        bar.innerHTML = `<div style="flex:1;min-width:200px"><b>${ic('pencil')} 書きかけの内容があります</b><div class="small">${md(ymd(new Date(old.t)))} ${hhmm(old.t)} に入力して、保存しないまま閉じた内容です。</div></div>
          <button type="button" class="btn small primary" data-draft="use">${ic('back')}続きから書く</button><button type="button" class="btn small ghost" data-draft="drop">使わない</button>`;
        form.querySelector('.dlg-b').prepend(bar);
        bar.addEventListener('click', e => {
          const b = e.target.closest('[data-draft]'); if (!b) return;
          if (b.dataset.draft === 'use') { fillForm(form, old.entries); toast('書きかけの内容を戻しました'); keep(); } else dropDraft(draft.key);
          if (bar) { bar.remove(); bar = null; }
        });
      }
    }
    draftAuto = null;
  }
  modal.showModal();
  bindPhraseBar(modal);
  modal.querySelectorAll('textarea[data-autogrow]').forEach(autoGrow);
  modal.scrollTop = 0;
}

// 下書きの内容をフォームに戻す
function fillForm(form, entries){
  const vals = {};
  entries.forEach(([k, v]) => (vals[k] = vals[k] || []).push(v));
  // 手順書：手順の欄が足りなければ増やす
  const add = form.querySelector('[data-step="add"]');
  if (add && vals.step) { let guard = 0; while (form.querySelectorAll('[name="step"]').length < vals.step.length && guard++ < 200) add.click(); }
  const els = [...form.elements].filter(el => el.name && el.type !== 'password' && el.type !== 'file' && el.type !== 'submit' && el.type !== 'button');
  const seen = {};
  els.forEach(el => {
    const v = vals[el.name] || [];
    let changed = false;
    if (el.type === 'checkbox' || el.type === 'radio') { const c = v.includes(el.value); changed = el.checked !== c; el.checked = c; }
    else if (el.tagName === 'SELECT' && el.multiple) { [...el.options].forEach(o => { o.selected = v.includes(o.value); }); changed = true; }
    else { const i = seen[el.name] = (seen[el.name] ?? -1) + 1; const nv = i < v.length ? v[i] : ''; changed = el.value !== nv; el.value = nv; }
    if (changed) el.dispatchEvent(new Event(el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio' ? 'change' : 'input', { bubbles: true }));
  });
  form.querySelectorAll('textarea[data-autogrow]').forEach(autoGrow);
}

// 開いている間に他の職員が同じ項目を変えていないか調べ、変更された項目だけを反映する
function applyChanges(target, orig, fields, fd, what){
  const changed = [], conflicts = [];
  fields.forEach(([key, label, get]) => {
    const v = get(fd);
    if (sameVal(v, orig[key])) return;
    changed.push([key, v]);
    if (!sameVal(target[key], orig[key]) && !sameVal(target[key], v)) conflicts.push(label);
  });
  if (!changed.length) return { none: true };
  if (conflicts.length && !confirm(`この画面を開いている間に、${target.updatedBy || '他の職員'}さんが「${conflicts.join('」「')}」を更新しました。\n\nあなたの入力内容で上書きしますか？\n（キャンセルすると入力画面に戻ります）`)) return { cancel: true };
  changed.forEach(([k, v]) => { target[k] = v; });
  return { changed };
}

// 利用者のまとめて登録：1行に1人。「名前」と「ふりがな」をタブ（Excel から貼り付けたとき）・カンマ・読点で区切る
function parseUserList(text){
  const have = new Set(live('users').map(u => u.name.replace(/\s+/g, '')));
  const seen = new Set();
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const [name, kana = ''] = l.split(/\t|,|，|、/).map(x => x.trim());
    const key = (name || '').replace(/\s+/g, '');
    const dup = !key || have.has(key) || seen.has(key);
    seen.add(key);
    return { name: (name || '').replace(/\s+/g, ' '), kana: kana.replace(/\s+/g, ' '), dup };
  });
}

function userPairs(id){
  const pairs = [['users', id]];
  const wids = new Set(live('works').filter(w => w.userId === id).map(w => w.id));
  ['hearings', 'works', 'hist', 'meetings', 'dayplan', 'docs', 'chats', 'lunch'].forEach(k => live(k).filter(x => x.userId === id).forEach(x => pairs.push([k, x.id])));
  live('logs').filter(l => l.userId === id || wids.has(l.workId)).forEach(l => pairs.push(['logs', l.id]));
  if (skillOf(id)) pairs.push(['skills', id]);
  if (jobsOf(id)) pairs.push(['jobs', id]);
  return pairs;
}
function editUser(id, part){
  const isNew = !id;
  const u = isNew ? { tasks: [], voiceMethods: [], voice: '' } : userById(id);
  if (!u) return;
  const parts = isNew ? Object.keys(USER_PARTS).filter(p => p !== 'docs' && p !== 'profile') : [part && USER_PARTS[part] ? part : 'basic'];
  const orig = clone(u);
  const body = (parts.length > 1 ? parts.map(p => formSec(USER_PARTS[p].icon, USER_PARTS[p].title, userPartForm(p, u, isNew))).join('') : userPartForm(parts[0], u, isNew))
    + `<div class="form-sec">${staffInput('u_staff', state.me)}</div>`;
  const foot = (!isNew && parts[0] === 'basic') ? `<button type="button" class="btn danger" id="delBtn">${ic('trash')}利用者を削除</button>` : '';
  const title = isNew ? '利用者を追加' : `${esc(u.name)}さん：${USER_PARTS[parts[0]].title}`;
  nextDraft = { key: 'user:' + (id || 'new') + ':' + (part || 'all'), open: ['editUser', { id, part }] };
  openModal(title, body, fd => {
    const fields = parts.flatMap(p => USER_PARTS[p].fields);
    const extra = splitList(fd.get('newTasks'));
    if (extra.some(t => !db.settings.taskMaster.includes(t))) { extra.forEach(t => { if (!db.settings.taskMaster.includes(t)) db.settings.taskMaster.push(t); }); touchSettings(); }
    const staff = takeStaff(fd);
    if (isNew) {
      const nu = { id: uid() };
      fields.forEach(([k, , get]) => { nu[k] = get(fd); });
      if (!nu.name) return false;
      Object.assign(nu, { updatedAt: today(), updatedBy: staff });
      db.users.push(touch(nu)); state.userId = nu.id; state.view = 'detail';
      save(); toast('登録しました'); return;
    }
    const cur = userById(id);
    if (!cur) { alert('この利用者は、他の職員によって削除されました。'); return; }
    if (parts[0] === 'basic' && !String(fd.get('name') || '').trim()) return false;
    const r = applyChanges(cur, orig, fields, fd);
    if (r.cancel) return false;
    if (r.none) { toast('変更はありませんでした'); return; }
    if (cur.archived && !cur.archivedAt) cur.archivedAt = today(); else if (!cur.archived) delete cur.archivedAt;   // 利用終了にした日（記録の整理で使う）
    Object.assign(cur, { updatedAt: today(), updatedBy: staff }); touch(cur);
    save(); toast('保存しました');
  }, foot);
  if (foot) $('#delBtn').onclick = () => {
    if (!confirmDelete(`${u.name}さんの情報（ヒアリング・作品・チェックリストを含む）`, `\n（利用を終えた方は「利用終了」にすると、一覧から外して情報を残せます）`)) return;
    const pairs = userPairs(id);
    modal.close(); state.view = 'users';
    deleteWithUndo(`${u.name}さんの情報`, pairs);
  };
}

function compareHearing(userId){
  const u = userById(userId);
  const [cur, prev] = fullHearingsOf(userId);
  if (!cur || !prev) return;
  let diffN = 0;
  const rows = HEARING_FIELDS.map(([k, label]) => {
    const a = fmtVal(prev[k]), b = fmtVal(cur[k]);
    const diff = a !== b; if (diff) diffN++;
    return `<tr class="${diff ? 'diff' : ''}"><th style="white-space:normal">${label}${diff ? `<div class="small" style="color:var(--warn)">変更あり</div>` : ''}</th><td class="pre">${esc(a) || '<span class="muted">－</span>'}</td><td class="pre">${esc(b) || '<span class="muted">－</span>'}</td></tr>`;
  }).join('');
  openModal(`${esc(u.name)}さん：前回のヒアリングとの比較`,
    `<p class="small" style="margin:0 0 12px">${diffN ? `<b>${diffN}項目</b>が変わっています（色の付いた行）。` : '前回から変わった項目はありません。'}</p>

}

  nextDraft = { key: 'log:' + workId, open: ['addLog', { id: workId }], title: `進み具合を記録（${u.name}さん・${w.title}）` };
  openModal('進み具合を記録', body, fd => {
    const text = fd.get('text').trim(), next = fd.get('next').trim(), mood = String(fd.get('mood') || '').trim();
    const staff = takeStaff(fd);
    const cur = workById(workId);
    if (!cur) { alert('この作品は、他の職員によって削除されました。'); return; }
    const st = fd.get('status');

    if (st && st !== cur.status) { cur.status = st; if (st === 'done' && !cur.doneDate) cur.doneDate = today(); cur.updatedAt = today(); cur.updatedBy = staff; touch(cur); }
    save(); toast('記録しました');
  });
}

// 入力画面の上に固定する定型文の帯（押すと、最後に触った欄の文の終わりに入る）
// keys を複数渡すと、選んでいる欄（data-ph）に合う定型文だけを出す
// 定型文の欄を開いておくか（パソコンごとに覚える。最初はパソコンでは開き、スマホでは閉じる）
const phrOpen = () => { const v = local.get('phrOpen'); return v == null ? !matchMedia('(max-width:700px)').matches : v === '1'; };
const phraseBar = keys => { keys = [].concat(keys).filter(k => opt(k).length); return keys.length ? `<details class="pbar" ${phrOpen() ? "open" : ""}><summary class="small">定型文を使う<span class="muted">（押すと欄に入ります）</span></summary><div class="phrases pchips" aria-label="定型文">${keys.map(k => `<span class="pgrp" data-ph="${k}">${opt(k).map(p => `<button type="button" class="phrase" data-phrase="${esc(p)}">${esc(p)}</button>`).join('')}</span>`).join('')}</div></details>` : ''; };
function bindPhraseBar(root){
  const bar = root.querySelector('.pbar'); if (!bar) return;
  bar.addEventListener('toggle', () => local.set('phrOpen', bar.open ? '1' : '0'));
  const f = bar.closest('form') || root;   // 入力画面ごとに作り直される要素に付ける（開くたびに重ならないように）
  const h = root.querySelector('.dlg-h'); bar.style.top = (h ? h.offsetHeight : 0) + 'px';
  const pick = () => [...f.querySelectorAll('textarea')].find(t => t.name !== 'summary');
  let ta = pick();
  const mark = () => {
    f.querySelectorAll('textarea.ptarget').forEach(t => t.classList.remove('ptarget'));
    if (ta) ta.classList.add('ptarget');
    const grps = [...bar.querySelectorAll('.pgrp')];
    if (grps.length > 1) { const want = ta && ta.dataset.ph && grps.some(g => g.dataset.ph === ta.dataset.ph) ? ta.dataset.ph : grps[0].dataset.ph; grps.forEach(g => { g.hidden = g.dataset.ph !== want; }); }
    bar.querySelectorAll('[data-phrase]').forEach(b => b.classList.toggle('on', !!ta && ta.value.includes(b.dataset.phrase + '。')));
  };
  f.addEventListener('focusin', e => { if (e.target.tagName === 'TEXTAREA') { ta = e.target; mark(); } });
  f.addEventListener('input', e => { if (e.target === ta) mark(); });
  bar.querySelectorAll('[data-phrase]').forEach(b => b.onclick = () => {
    if (!ta) return;
    const p = b.dataset.phrase + '。';
    ta.value = ta.value.includes(p) ? ta.value.replace(p, '').trim() : (ta.value.trim() ? ta.value.trim().replace(/[。、]?$/, '。') : '') + p;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    autoGrow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  });
  mark();
}

const oneLine = s => String(s || '').replace(/\s*\n\s*/g, ' ').trim();

const REPORT_DEF = { title: '利用者対応', nameFmt: 'full', honor: 'さん', titleDate: false, titleStaff: false, wrap: '', items: { work: true, mood: true, next: true, meet: true, off: true }, labels: { work: '作業内容', mood: '様子', next: '次回' } };
function reportCfg(){

  return { ...REPORT_DEF, ...r, wrap: r.wrap || (local.get('drChatwork') ? 'chatwork' : 'none'), items: { ...REPORT_DEF.items, ...(r.items || {}) }, labels: { ...REPORT_DEF.labels, ...(r.labels || {}) } };
}
// イニシャル：ふりがなの頭文字をローマ字にする（例：さんぷる たろう → S.T.）
const KANA_INI = (() => {
  const m = {}, rows = [['あいうえお', 'AIUEO'], ['かきくけこ', 'K'], ['がぎぐげご', 'G'], ['さしすせそ', 'SSSSS'], ['ざじずぜぞ', 'ZJZZZ'], ['たちつてと', 'TCTTT'], ['だぢづでど', 'DJZDD'], ['なにぬねの', 'N'], ['はひふへほ', 'HHFHH'], ['ばびぶべぼ', 'B'], ['ぱぴぷぺぽ', 'P'], ['まみむめも', 'M'], ['やゆよ', 'Y'], ['らりるれろ', 'R'], ['わゐゑを', 'WIEO'], ['ん', 'N'], ['ゔ', 'V']];
  rows.forEach(([ks, ls]) => [...ks].forEach((k, i) => { m[k] = ls[i] || ls[0]; }));
  return m;
})();
function initialOf(u){
  const parts = normSearch(u.kana || '').trim().split(/\s+/).filter(Boolean);
  const ini = parts.map(p => KANA_INI[p[0]] || (/[a-z]/i.test(p[0]) ? p[0].toUpperCase() : ''));
  return parts.length && ini.every(Boolean) ? ini.join('.') + '.' : '';
}
function reportName(u, fmt){
  if (fmt === 'initial') return initialOf(u) || '（ふりがな未入力）';
  if (fmt === 'family') return String(u.name || '').trim().split(/[\s　]+/)[0];
  return u.name;
}
function dailyText(date, who, cfg){
  const R = cfg || reportCfg(), I = R.items, Lb = R.labels;
  const nm = u => reportName(u, R.nameFmt);
  const users = live('users').filter(u => !u.archived).sort(byKana);
  const blocks = [], missing = [], noKana = [];
  users.forEach(u => {
    const logs = worksOf(u.id).flatMap(w => logsOf(w.id).filter(l => l.date === date && (!who || l.staff === who)).map(l => ({ w, l }))).sort((a, b) => a.l._ts - b.l._ts);
    const ms = I.meet ? meetingsOf(u.id).filter(m => !staffOnlyKind(m.kind) && m.date === date && (!who || m.staff === who)) : [];
    const p = live('dayplan').find(x => x.date === date && x.userId === u.id);
    // 在宅の人は、記録がなくても連絡の時刻と空の欄を出す（自分の分のときは、自分が連絡した人だけ）
    const part = homePartOn(u, date), calls = part && p ? [1, 2].map(k => p['c' + k]).filter(Boolean) : [];
    const homeCalled = !!part && (!who || calls.some(c => c.by === who));
    if (!logs.length && !ms.length && !homeCalled && !(p && (p.mode === 'late' || p.mode === 'early') && !who)) {
      if (!who && date === today() && (comesToday(u) || isHomeToday(u))) missing.push(u.name);
      return;
    }
    if (R.nameFmt === 'initial' && !initialOf(u)) noKana.push(u.name);
    const late = p && (p.mode === 'late' || p.mode === 'early') ? '（' + (p.mode === 'late' ? '遅刻' : '早退') + (p.at ? ' ' + p.at : '') + (p.note ? '・' + p.note : '') + '）' : '';
    const partT = p && p.mode === 'part' ? (p.part === 'am' ? '（午前だけ通所）' : '（午後から通所）') : '';
    const head = `${nm(u)}${R.honor}${part ? '（' + HOME_PART[part] + (calls.length ? '・連絡 ' + calls.map(c => c.t).join('／') : '') + '）' : ''}${late}${partT}`;
    const L = [];
    if (I.work) {
      logs.forEach(({ w, l }) => { if (l.text) L.push(`${Lb.work}：${w.title}　${oneLine(l.text)}`); });
      if (logs.length && !logs.some(x => x.l.text)) L.push(`${Lb.work}：${[...new Set(logs.map(x => x.w.title))].join('、')}`);
      if (!logs.length) L.push(`${Lb.work}：`);
    }
    if (I.mood) L.push(`${Lb.mood}：${logs.map(x => oneLine(x.l.mood)).filter(Boolean).join(' ')}`);
    ms.forEach(m => L.push(`${(MEET_KIND[m.kind] || MEET_KIND.interview).t}：${oneLine(m.agreed || m.note || m.wish || m.talk) || '実施'}`));
    const nexts = logs.map(x => oneLine(x.l.next)).filter(Boolean);
    if (I.next && nexts.length) L.push(`${Lb.next}：${nexts.join('／')}`);
    blocks.push(R.wrap === 'markdown' ? `**${head}**\n${L.map(x => '- ' + x).join('\n')}` : `■ ${head}\n${L.join('\n')}`);
  });
  if (!who && I.off) {
    const off = live('dayplan').filter(x => x.date === date && x.mode === 'off').map(x => userById(x.userId)).filter(Boolean).map(nm);
    if (off.length) blocks.push((R.wrap === 'markdown' ? '**お休み**：' : 'お休み：') + off.join('、'));
  }
  const title = [R.title || '利用者対応', R.titleDate ? md(date) : ''].filter(Boolean).join(' ') + (R.titleStaff && who ? '（' + who + '）' : '');
  const body = blocks.join('\n\n') || '（この日の記録はありません）';
  const text = R.wrap === 'chatwork' ? `[info][title]${title}[/title]${body}[/info]` : R.wrap === 'markdown' ? `## ${title}\n\n${body}` : `【${title}】\n${body}`;
  return { text, missing, noKana };
}

function copyText(text, done){

}

function editJobs(userId){

    const map = { ...(cur.map || {}) };
    let n = 0;
    const changes = [];
    db.settings.jobTypes.forEach(g => g.items.forEach(i => {
      const v = Number(fd.get('jb_' + i.id) || 0), was = Number((orig.map || {})[i.id] || 0);
      if (v === was) return;
      n++; changes.push({ id: i.id, label: i.label, from: was, to: v });
      if (v) map[i.id] = v; else delete map[i.id];
    }));
    const conds = [...new Set([...fd.getAll('conds'), ...splitList(fd.get('conds_other'))])];
    const note = fd.get('note');
    let cOut = cur.conds || [], nOut = cur.note || '';
    if (!sameVal(conds, orig.conds || [])) { cOut = conds; n++; }
    if (!sameVal(note, orig.note || '')) { nOut = note; n++; }
    if (!n) { toast('変更はありませんでした'); return; }
    const staff = takeStaff(fd);
    const doc = touch({ id: userId, userId, map, conds: cOut, note: nOut, updatedAt: today(), updatedBy: staff });
    const i = db.jobs.findIndex(x => x.id === userId);
    if (i >= 0) db.jobs[i] = doc; else db.jobs.push(doc);
    if (changes.length) db.hist.push(touch({ id: uid(), userId, kind: 'job', date: today(), staff, changes }));
    save(); toast('振れる案件を保存しました');
  });
}

      + ta('wish', 'きっかけ・背景', '例：締切が近く、朝から落ち着かない様子だった')
      + ta('note', 'その場の対応', '例：別室で話を聞き、落ち着いてから家族に連絡した')
      + ta('agreed', '再発防止策', '例：席を離す。締切前は午前に一度、職員から声を掛ける')
      + `<label class="chip-check"><input type="checkbox" name="done" ${m0.done === '1' ? 'checked' : ''}><span>${ic('check')}再発防止策を職員に共有した</span></label>

      + ta('note', '対応したこと', '例：席を窓側に移した。本人と話して、気になるときは手を挙げて知らせることにした')
      + ta('agreed', '結果・今後の対応', '例：1週間ようすを見て、もう一度本人に聞く')
      + `<label class="chip-check"><input type="checkbox" name="done" ${m0.done === '1' ? 'checked' : ''}><span>${ic('check')}対応が済んだ</span></label>

    const F = m0.from || (prev && prev.to ? ymd(new Date(parse(prev.to).getTime() + 86400000)) : addDays(-182));
    const T = m0.to || today();
    const ints = meetingsOf(u.id).filter(m => m.kind === 'interview');
    const linked = m0.linked || ints.filter(m => m.date >= F && m.date <= T).map(m => m.id);
    const summary = m0.summary || monitoringText(u, F, T, linked);
    body = `<div class="grid2" style="gap:0 14px">${dateInput('m_date', 'date', m0.date, '実施日')}${staffInput('m_staff', state.me, '記入した職員')}

    if (kind === 'interview') {

        const has = (m.linked || []).includes(cur.id);
        if (has && m.id !== want) { m.linked = m.linked.filter(x => x !== cur.id); touch(m); }

// Excel が文字コードを判別できるよう先頭に印（BOM）を付ける。= などで始まる値は数式として動かないように ' を付ける
const csvCell = v => { let s = String(Array.isArray(v) ? v.join('、') : v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

const CSV_KINDS = () => [
  ['users', '利用者の一覧'], ['logs', '進み具合の記録'], ['meet', '面談・モニタリング'], ['complaint', '相談・苦情'], ['trouble', 'トラブル'],

function csvRows(kind, from, to){

  const byDate = (a, b) => (a.date || '').localeCompare(b.date || '');

    ...live('users').slice().sort(byKana).map(u => [u.name, u.kana, u.mainStaff, officeDays(u).map(d => WDN[d]).join('・'), u.tasks, u.goalLong, u.goalShort, u.strengths, (VOICE[u.voice] || {}).label, u.voiceTraits, u.voiceMethods, u.voiceTips, u.cautions, u.notes, u.allergy, u.dislike, u.foodNote, u.archived ? '利用終了' : ''])];

    ...live('logs').filter(l => inR(l.date) && workById(l.workId)).sort(byDate).map(l => { const w = workById(l.workId); return [l.date, name(w.userId), w.title, w.field, l.text, l.mood, l.next, l.staff]; })];
  if (kind === 'meet') return [['日付', '利用者', '種類', '本人の話', '本人の希望・意向', '職員の所見・評価', '決まったこと・方針', '次回の予定日', '記入した職員'],
    ...live('meetings').filter(m => !staffOnlyKind(m.kind) && inR(m.date)).sort(byDate).map(m => [m.date, name(m.userId), (MEET_KIND[m.kind] || MEET_KIND.interview).t, m.talk, m.wish, m.note, m.agreed, m.nextDate, m.staff])];
  if (kind === 'complaint') return [['受けた日', '利用者', '誰から', '内容', '対応したこと', '結果・今後の対応', '状況', '対応した職員'],
    ...live('meetings').filter(m => m.kind === 'complaint' && inR(m.date)).sort(byDate).map(m => [m.date, name(m.userId), complaintFrom(m), m.talk, m.note, m.agreed, m.done === '1' ? '対応済み' : '対応中', m.staff])];
  if (kind === 'trouble') return [['起きた日', '利用者', '場所・関わった人', '何があったか', 'きっかけ・背景', 'その場の対応', '再発防止策', '共有', '記入した職員'],

  return [['案件', '依頼元', '受けた日', '納期', '状態', '担当', '内容'],
    ...live('orders').filter(o => inR(o.receivedDate || o.dueDate)).sort((a, b) => (a.receivedDate || '').localeCompare(b.receivedDate || '')).map(o => [o.title, o.client, o.receivedDate, o.dueDate, (ORDER_ST[o.status] || {}).t, (o.assignees || []).map(name).filter(Boolean), o.detail])];
}
function exportCsv(){
  const body = `<div class="field"><label class="f">書き出すもの</label>${chipRadios('csv_kind', CSV_KINDS(), 'users', true)}</div>
    <div class="grid2 csv-dates" style="gap:0 14px">${dateInput('csv_from', 'from', '', '期間（はじめ）')}${dateInput('csv_to', 'to', '', '期間（おわり）')}</div>

    <div class="alert warn small" style="margin:0"><b>${ic('warning')} CSV は暗号化されません</b><br>パスワードがなくても読めるファイルです。バックアップの代わりにはなりません。事業所の外に持ち出さず、使い終わったら削除してください。</div>`;
  openModal('Excel で開ける形で書き出す', body, fd => {

    if (from && to && from > to) { alert('「はじめ」が「おわり」より後になっています。'); return false; }
    const rows = csvRows(kind, kind === 'users' ? '' : from, kind === 'users' ? '' : to);
    if (rows.length < 2) { alert('この条件で書き出す記録はありません。'); return false; }
    const label = CSV_KINDS().find(([k]) => k === kind)[1].replace(/・/g, '');
    download(`作業支援ノート_${label}_${today()}.csv`, csvText(rows), 'text/csv;charset=utf-8');

  });
  const sb = modal.querySelector('button[type="submit"]'); if (sb) sb.innerHTML = ic('download') + '書き出す';
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  const finish = d => {
    if (!d || !Array.isArray(d.users)) throw new Error();
    if (!confirm(`バックアップ（利用者${d.users.filter(u => !u.deleted).length}名分）を、いまのデータと統合します。よろしいですか？`)) return;
    db = mergeDb(db, normalize(d)); primeSettings(); save(); render(); toast('読み込みました');
  };
  const bad = () => alert('このファイルは読み込めませんでした。「バックアップを保存」で作ったファイルを選んでください。');
  rd.onload = async () => {
    try {
      const d = parseLoose(rd.result).value;
      if (!isEnv(d)) { finish(d); return; }
      // 暗号化されたバックアップ
      const key = crypt.keys.get(d.salt);
      if (key) { finish(JSON.parse(await decryptEnv(d, key))); return; }
      openModal('バックアップのパスワード',
        `<p class="small" style="margin-top:0">このバックアップは暗号化されています。作ったときのパスワードを入力してください。</p>
        <div class="field" style="margin-bottom:0"><label class="f" for="bk_pass">パスワード</label><input type="password" spellcheck="false" autocapitalize="off" lang="en" inputmode="text" id="bk_pass" name="pass" required></div>`,
        fd => { (async () => { try { const { text } = await tryPassword(d, fd.get('pass')); modal.close(); finish(JSON.parse(text)); } catch(e) { alert('パスワードが違います。'); } })(); return false; });

const SAMPLE_STAFF = 'サンプル職員';
function sampleTargets(){
  const users = live('users').filter(u => u.sample === true || /^サンプル[ 　]/.test(u.name || ''));
  const ids = new Set(users.map(u => u.id));
  const pairs = users.map(u => ['users', u.id]);
  ['hearings', 'works', 'logs', 'hist', 'meetings', 'dayplan'].forEach(k => live(k).filter(x => x.sample === true || ids.has(x.userId)).forEach(x => pairs.push([k, x.id])));
  ['skills', 'jobs'].forEach(k => live(k).filter(x => x.sample === true || ids.has(x.id)).forEach(x => pairs.push([k, x.id])));
  const orders = live('orders').filter(o => o.sample === true || (/^サンプル/.test(o.client || '') && (o.assignees || []).length && (o.assignees || []).every(a => ids.has(a))));
  orders.forEach(o => pairs.push(['orders', o.id]));
  const SG = ['Blenderの起動から保存まで', 'CapCutでテロップを入れる'];
  const guides = live('guides').filter(g => g.sample === true || (SG.includes(g.title) && g.updatedBy === SAMPLE_STAFF));
  guides.forEach(g => pairs.push(['guides', g.id]));
  const SE = { 'PC-1': '作業室の壁側', 'PC-2': '作業室の窓側', 'PC-3': '作業室の中央', '液タブA': 'PC-1につなぐ' };
  const equip = live('equip').filter(e => e.sample === true || (SE[e.name] && (SE[e.name] === e.place || (e.name === '液タブA' && e.place === '作業室の壁側')) && e.updatedBy === SAMPLE_STAFF));
  equip.forEach(e => pairs.push(['equip', e.id]));
  return { pairs, users, ids, orders, guides, equip, staff: db.settings.staffList.includes(SAMPLE_STAFF) };
}

  if (!confirm(`次のサンプルデータを消します。\n\n${lines.join('\n')}\n\nよろしいですか？（消した直後なら「元に戻す」で戻せます）`)) return;
  const saved = t.pairs.map(([k, id]) => [k, clone(db[k].find(x => x.id === id))]).filter(([, x]) => x);

  const keepEq = live('equip').filter(e => !t.equip.includes(e) && [...Object.values(e.assign || {}), ...Object.values(e.assignPm || {})].some(v => t.ids.has(v)));
  const savedEq = keepEq.map(e => clone(e));

    saved.forEach(([k, x]) => { const i = db[k].findIndex(y => y.id === x.id); const it = touch({ ...x }); if (i >= 0) db[k][i] = it; else db[k].push(it); });
    savedEq.forEach(x => { const i = db.equip.findIndex(y => y.id === x.id); if (i >= 0) db.equip[i] = touch({ ...x }); });

}
/* ---------- スマホ閲覧版：暗号化した共有ファイルを選び、パスワードで開いて見るだけ ----------
   記録はメモリにだけ置き、ブラウザの保存領域には書かない。別のアプリに切り替える・5分操作しない・「閉じる」で消す */
function viewerPrune(root){
  root.querySelectorAll('[data-act]').forEach(el => { if (!VIEW_OK.has(el.dataset.act)) el.style.display = 'none'; });
  root.querySelectorAll('input, select, textarea').forEach(el => { if (el.id !== 'sq' && el.id !== 'sUser') el.disabled = true; });
}
function viewerClose(){ db = normalize({}); location.reload(); }
function viewerArm(){
  let t = 0;
  const idle = () => { clearTimeout(t); t = setTimeout(viewerClose, 5 * 60 * 1000); };
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, idle, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) viewerClose(); });
  addEventListener('pagehide', viewerClose);
  idle();
}
// 前回のファイルは、暗号化されたまま（パスワードがないと読めない形で）このスマホに覚えておく
let vFile = null;
const vdb = (mode, fn) => new Promise((res, rej) => {
  const q = indexedDB.open('shienNoteView', 1);
  q.onupgradeneeded = () => q.result.createObjectStore('f');
  q.onerror = () => rej(q.error);
  q.onsuccess = () => { const tx = q.result.transaction('f', mode); const r = fn(tx.objectStore('f')); tx.oncomplete = () => { q.result.close(); res(r && r.result); }; tx.onerror = () => rej(tx.error); };
});
const vLoad = () => Promise.race([vdb('readonly', s => s.get('last')).catch(() => null), new Promise(r => setTimeout(() => r(null), 1500))]);
const vSave = v => vdb('readwrite', s => s.put(v, 'last')).catch(() => {});
const vForget = () => vdb('readwrite', s => s.delete('last')).catch(() => {});
const vTime = t => { const d = new Date(t); return `${md(ymd(d))} ${hhmm(d)}`; };
function viewerBanner(){
  return `<div class="alert info small noprint row" style="gap:8px 12px"><span style="flex:1;min-width:200px"><b>${ic('lock')}閲覧専用です。</b>${vFile ? `<span class="nw">ファイルの日時：${vTime(vFile.time)}</span>。` : ''}別のアプリに切り替えるか、5分操作しないと閉じます。</span><button class="btn small" data-act="viewerClose">閉じる</button></div>`;
}
async function viewerOpen(){
  const saved = await vLoad();
  $('#nav').innerHTML = ''; $('#menuBtn').style.display = 'none';
  $('#app').innerHTML = `<div class="card vcard">
    <h1 style="font-size:22px;margin:0 0 12px">スマホ閲覧版</h1>
    <p class="small muted" style="margin:0 0 26px">${saved ? 'パスワードを入れると、前回のファイルの記録を見られます。' : '共有データファイルを選び、パスワードを入れると記録を見られます。'}見るだけで、変更はできません。</p>
    <form id="vform" autocomplete="off">
      ${saved ? `<div class="field" id="v_saved"><label class="f">前回のファイル</label>
        <div class="filepick" style="cursor:default"><span class="fp-name on">${esc(saved.name || '共有データファイル')}</span></div>
        <div class="small muted" style="margin-top:6px">ファイルの日時：${vTime(saved.time)}　<span class="nw">（このスマホに暗号化したまま覚えています）</span></div>
        <div class="row" style="gap:8px 16px;margin-top:8px"><button type="button" class="linkbtn small" id="v_other">別のファイルを選ぶ</button><button type="button" class="linkbtn small" id="v_forget">このスマホから消す</button></div></div>` : ''}
      <div class="field" id="v_pick" ${saved ? 'hidden' : ''}><label class="f" for="v_file">共有データファイル</label><input type="file" id="v_file" class="vh">
        <label for="v_file" class="filepick"><span class="fp-btn">${ic('upload')}ファイルを選ぶ</span><span class="fp-name" id="v_name">まだ選んでいません</span></label>
        <div class="small muted" style="margin-top:6px">Google ドライブの<span class="nw">「作業支援ノート_共有データ.json」</span>を選びます。新しい内容を見るときは、選び直してください。</div>
        <label class="vkeep"><input type="checkbox" id="v_keep" checked><span>このスマホに覚えておく（暗号化したまま）</span></label></div>
      <div class="field"><label class="f" for="v_pass">パスワード</label><input type="password" id="v_pass" required spellcheck="false" autocapitalize="off" autocomplete="current-password"></div>
      <p class="stale small" id="v_msg" style="margin:0 0 14px" hidden></p>
      <button type="submit" class="btn primary" style="width:100%;justify-content:center">${ic('lock')}開く</button>
    </form></div>`;
  phraseBreaks($('#app'));
  const say = m => { const p = $('#v_msg'); p.innerHTML = ic('warning') + esc(m); p.hidden = false; };
  $('#v_file').addEventListener('change', () => { const f = $('#v_file').files[0]; $('#v_name').textContent = f ? f.name : 'まだ選んでいません'; $('#v_name').classList.toggle('on', !!f); $('#v_msg').hidden = true; });
  if (saved) {
    $('#v_other').addEventListener('click', () => { $('#v_saved').hidden = true; $('#v_pick').hidden = false; });
    $('#v_forget').addEventListener('click', async () => { if (!confirm('このスマホに覚えているファイルを消しますか？')) return; await vForget(); viewerOpen(); });
  }
  $('#vform').addEventListener('submit', async e => {
    e.preventDefault();
    const f = $('#v_pick').hidden ? null : $('#v_file').files[0], pass = $('#v_pass').value;
    $('#v_pass').value = '';
    if (!f && !saved) { say('共有データファイルを選んでください。'); return; }
    if (!f && !$('#v_pick').hidden) { say('共有データファイルを選んでください。'); return; }
    const src = f ? { text: await f.text(), name: f.name, time: f.lastModified } : saved;
    let env = null;
    try { env = JSON.parse(src.text); } catch(err) { say('作業支援ノートの共有データファイルではありません。'); return; }
    if (!isEnv(env)) { say(env && Array.isArray(env.users) ? '暗号化されていないファイルは開けません。パソコンの作業支援ノートで、データを暗号化してから使ってください。' : '作業支援ノートの共有データファイルではありません。'); return; }
    if (!crypt.supported) { say('このブラウザでは開けません。Chrome または Safari で開いてください。'); return; }
    let text;
    try { ({ text } = await tryPassword(env, pass)); } catch(err) { say('パスワードが違います。'); return; }
    let parsed = null; try { parsed = JSON.parse(text); } catch(err) {}
    if (!parsed || !Array.isArray(parsed.users)) { say('作業支援ノートの共有データファイルではありません。'); return; }
    if (f) { if ($('#v_keep').checked) await vSave(src); else await vForget(); }
    vFile = { name: src.name, time: src.time };
    db = normalize(parsed); crypt.on = true; crypt.salt = env.salt;
    started = true; primeSettings(); state.view = 'today'; $('#menuBtn').style.display = ''; render(); window.scrollTo(0, 0); viewerArm();
  });
}

(async function boot(){
  if (APP_VIEWER) { viewerOpen(''); return; }
  const raw = APP_TRIAL ? null : await readMainRaw();
  let parsed = null;
  try { parsed = raw ? JSON.parse(raw) : null; } catch(e) {}
  if (isEnv(parsed)) {
    crypt.on = true; crypt.salt = parsed.salt;
    if (!crypt.supported) { $('#app').innerHTML = '<div class="card" style="margin:40px auto;max-width:520px">データは暗号化されています。Google Chrome または Microsoft Edge で開いてください。</div>'; return; }
    showLock(parsed); return;
  }
  db = normalize(parsed || {}); primeSettings();
  start();
})();
</script>
</body>
